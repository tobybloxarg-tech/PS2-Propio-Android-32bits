name: Android ARM32 Optimized APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all Git tags
        run: git fetch --tags --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.1"

      - name: Create temporary signing key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/test-release.jks" -storepass testpass123 -keypass testpass123 -alias test -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Zapia Test Build, OU=Test, O=Local, L=NA, S=NA, C=US"

      - name: Build optimized ARM32 release APK
        run: |
          cd build_android
          ./gradlew assembleRelease --stacktrace \
            -PPLAY_RELEASE_STORE_FILE="$RUNNER_TEMP/test-release.jks" \
            -PPLAY_RELEASE_STORE_PASSWORD=testpass123 \
            -PPLAY_RELEASE_KEY_ALIAS=test \
            -PPLAY_RELEASE_KEY_PASSWORD=testpass123

      - name: Verify signed APK and ARM32 native library
        run: |
          APK=build_android/build/outputs/apk/release/Play-release.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -Z1 "$APK" | tee "$RUNNER_TEMP/apk-contents.txt"
          grep -Fxq 'lib/armeabi-v7a/libPlay.so' "$RUNNER_TEMP/apk-contents.txt"
          ! grep -Eq 'lib/(arm64-v8a|x86|x86_64)/' "$RUNNER_TEMP/apk-contents.txt"

      - name: Upload installable optimized ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-armeabi-v7a-release-optimized
          path: build_android/build/outputs/apk/release/Play-release.apk
          if-no-files-found: error
          retention-days: 14
