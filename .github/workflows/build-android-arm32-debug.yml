name: Android ARM32 Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm32-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all Git tags
        run: git fetch --tags --force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.1"

      - name: Build ARM32 debug APK
        run: |
          cd build_android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK includes ARM32 native library
        run: |
          APK=build_android/build/outputs/apk/debug/Play-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q 'lib/armeabi-v7a/.*\.so' /tmp/apk-contents.txt
          if grep -E 'lib/(arm64-v8a|x86|x86_64)/.*\.so' /tmp/apk-contents.txt; then
            echo 'Unexpected non-ARM32 native ABI found in APK' >&2
            exit 1
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Play-Android-armeabi-v7a-debug
          path: build_android/build/outputs/apk/debug/Play-debug.apk
          if-no-files-found: error
          retention-days: 14
